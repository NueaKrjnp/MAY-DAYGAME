<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Mayday! Board Game Table</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Orbitron:wght@500;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            background: #11141a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
            margin-bottom: 10px;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 35, 45, 0.9);
            border: 2px solid #3b82f6;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .box h3 {
            margin-bottom: 15px;
            color: #3b82f6;
            font-size: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .btn-join {
            background: linear-gradient(135deg, #10b981, #047857);
        }

        /* ==================== SCREEN GAME (โต๊ะบอร์ดเกม) ==================== */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle, #1a2436 0%, #0d131a 100%);
        }

        /* โต๊ะเกมวงรีตรงกลาง */
        .game-table {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 50vh;
            background: radial-gradient(circle, #1e3a5f 0%, #112240 100%);
            border: 8px solid #0a192f;
            border-radius: 200px; /* ทำให้เป็นวงรีเหมือนโต๊ะโป๊กเกอร์/UNO */
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 30px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* กองการ์ดและข้อมูลเครื่องบินตรงกลางโต๊ะ */
        .center-deck {
            text-align: center;
            background: rgba(10, 25, 47, 0.8);
            padding: 20px;
            border-radius: 50%;
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .plane-icon {
            font-size: 2.5rem;
            animation: float 3s ease-in-out infinite;
            color: #00f2fe;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* ตำแหน่งผู้เล่นล้อมรอบโต๊ะ (ตำแหน่งแบบวงกลมรอบหน้าจอ) */
        .players-circle {
            position: absolute;
            width: 95vw;
            height: 85vh;
            top: 7.5%;
            left: 2.5%;
            pointer-events: none;
        }

        .player-seat {
            position: absolute;
            background: #222b3c;
            border: 2px solid #4a5568;
            padding: 10px 15px;
            border-radius: 12px;
            width: 140px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* แจกตำแหน่งที่นั่งรอบโต๊ะ */
        .seat-0 { bottom: 20px; left: 50%; transform: translateX(-50%); border-color: #00f2fe; background: #0f172a; } /* ตัวเราเอง อยู่ล่างสุด */
        .seat-1 { top: 50%; left: 30px; transform: translateY(-50%); } /* ซ้าย */
        .seat-2 { top: 20px; left: 25%; transform: translateX(-50%); }  /* บนซ้าย */
        .seat-3 { top: 20px; left: 75%; transform: translateX(-50%); }  /* บนขวา */
        .seat-4 { top: 50%; right: 30px; transform: translateY(-50%); } /* ขวา */

        .avatar {
            width: 45px;
            height: 45px;
            background: #3b82f6;
            border-radius: 50%;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .seat-0 .avatar { background: #00f2fe; color: #000; }

        .player-name {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* เรดาร์แผนที่การบิน (แถบยาวด้านบนสุดของจอ) */
        .top-radar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 15, 25, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #ff3366;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
            max-width: 90vw;
        }

        .map-strip {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            max-width: 500px;
            padding: 5px;
        }

        .tile {
            min-width: 30px;
            height: 30px;
            background: #2d3748;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .tile.active {
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
            font-size: 1rem;
        }

        /* แผงปุ่มควบคุมด้านล่าง (ปุ่ม Action ยักษ์เหมือน UNO) */
        .action-panel {
            position: absolute;
            bottom: 30px;
            right: 40px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 30;
        }

        .card-btn {
            width: 100px;
            height: 140px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: 4px solid white;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .card-btn.descend {
            background: linear-gradient(135deg, #3b82f6, #10b981);
        }

        .card-btn:hover {
            transform: translateY(-15px) rotate(-3deg);
            box-shadow: 0 15px 30px rgba(255,255,255,0.2);
        }

        /* ข้อมูลห้องมุมซ้ายบน */
        .room-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            border-left: 4px solid #00f2fe;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby-screen" style="display: flex; flex-direction: column; gap: 20px;">
        <h1>✈️ MAYDAY! LINE OF SIGHT</h1>
        <div class="container box">
            <h3>สร้างห้องบอร์ดเกม</h3>
            <label>ชื่อเล่นของคุณ</label>
            <input type="text" id="create-name" placeholder="ใส่ชื่อ...">
            <label>จำนวนขาจอย</label>
            <select id="max-players">
                <option value="4">4 คน</option>
                <option value="5" selected>5 คน</option>
                <option value="6">6 คน</option>
            </select>
            <button onclick="createRoom()">เปิดโต๊ะเล่นเกม 🎲</button>
        </div>

        <div class="container box">
            <h3>เข้าร่วมโต๊ะของเพื่อน</h3>
            <label>ชื่อเล่นของคุณ</label>
            <input type="text" id="join-name" placeholder="ใส่ชื่อ...">
            <label>รหัสโต๊ะ 4 หลัก</label>
            <input type="text" id="room-code-input" placeholder="เช่น 8842">
            <button class="btn-join" onclick="joinRoom()">นั่งร่วมวงล้อมเสื่อ 🪑</button>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="room-info">
            <div id="room-display" style="font-weight: bold; color: #00f2fe;">ห้อง: ----</div>
            <div id="role-display" style="color: #a0aec0; margin-top: 5px;">บทบาท: รอแจกการ์ด...</div>
        </div>

        <div class="top-radar">
            <span>📡 แผนที่การบิน:</span>
            <div id="map-grid" class="map-strip"></div>
        </div>

        <div class="game-table">
            <div class="center-deck">
                <div class="plane-icon">✈️</div>
                <div style="font-size: 0.8rem; color: #a0aec0; margin-top: 5px;">พิกัดเครื่องบิน</div>
                <div id="plane-status" style="font-weight: bold; color: #00f2fe; font-size: 1.1rem;">ระดับ: -- | ระยะ: --</div>
            </div>
        </div>

        <div id="players-circle" class="players-circle">
            </div>

        <div class="action-panel">
            <div class="card-btn" onclick="playCard('Climb')">
                <span style="font-size: 1.5rem;">🔺</span>
                <span>ไต่ระดับ<br>CLIMB</span>
            </div>
            <div class="card-btn descend" onclick="playCard('Descend')">
                <span style="font-size: 1.5rem;">🔻</span>
                <span>ลดระดับ<br>DESCEND</span>
            </div>
        </div>

    </div>

    <script>
        const socket = io();
        let currentRoomCode = '';

        function createRoom() {
            const playerName = document.getElementById('create-name').value.trim();
            const maxPlayers = document.getElementById('max-players').value;
            if(!playerName) return alert('ใส่ชื่อก่อนสิครับเพื่อน!');
            socket.emit('createRoom', { playerName, maxPlayers });
        }

        function joinRoom() {
            const playerName = document.getElementById('join-name').value.trim();
            const roomCode = document.getElementById('room-code-input').value.trim();
            if(!playerName || !roomCode) return alert('กรอกชื่อและรหัสห้องให้ครบนะคุณ');
            socket.emit('joinRoom', { playerName, roomCode });
        }

        function playCard(type) {
            if(!currentRoomCode) return;
            socket.emit('playFlightCard', { roomCode: currentRoomCode, cardType: type });
        }

        socket.on('roomCreated', (data) => {
            currentRoomCode = data.roomCode;
            initGameView(data.roomCode);
        });

        function initGameView(code) {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('room-display').innerText = `ห้องเลขที่: ${code}`;
        }

        socket.on('gameStart', (msg) => {
            alert('🔥 ' + msg);
        });

        socket.on('gameStateUpdate', (data) => {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            // อัปเดตบทบาทและการแสดงผลตรงกลางโต๊ะ
            if(data.role) {
                document.getElementById('role-display').innerText = `บทบาท: ${data.role}`;
                document.getElementById('plane-status').innerText = `ระดับ: ${data.planeAltitude} | ระยะ: ${data.planePosition}`;
            }

            // จัดตำแหน่งเก้าอี้คนเล่นล้อมวง (UNO Style)
            const circle = document.getElementById('players-circle');
            circle.innerHTML = '';
            data.playersList.forEach((player, index) => {
                // วนลูปแจกคลาสเก้าอี้ seat-0 ถึง seat-4 กระจายรอบวงโต๊ะ
                const seatClass = `seat-${index % 5}`; 
                const firstLetter = player.charAt(0).toUpperCase();
                
                circle.innerHTML += `
                    <div class="player-seat ${seatClass}">
                        <div class="avatar">${firstLetter}</div>
                        <div class="player-name">${player}</div>
                    </div>
                `;
            });

            // แผนที่เรดาร์ด้านบน
            const mapGrid = document.getElementById('map-grid');
            mapGrid.innerHTML = '';
            data.map.forEach((tile, index) => {
                let isCurrent = (index === data.planePosition);
                mapGrid.innerHTML += `
                    <div class="tile ${isCurrent ? 'active' : ''}">
                        ${isCurrent ? '✈️' : index}
                    </div>
                `;
            });
        });

        socket.on('gameEvent', (msg) => {
            alert('📢 เหตุการณ์: ' + msg);
        });

        socket.on('errorMsg', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
